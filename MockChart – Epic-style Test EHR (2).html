const IX=[['lisinopril','ibuprofen','Moderate','NSAID can blunt BP control and raise kidney injury risk'],['lisinopril','spironolactone','Major','Additive high-potassium risk'],['sertraline','cyclobenzaprine','Major','Serotonin syndrome risk'],['sertraline','sumatriptan','Major','Serotonin syndrome risk'],['sertraline','ibuprofen','Moderate','Increased GI bleeding risk'],['clopidogrel','omeprazole','Moderate','Omeprazole may reduce clopidogrel activation'],['levothyroxine','ferrous','Moderate','Iron reduces levothyroxine absorption; separate by 4 hours'],['albuterol','metoprolol','Moderate','Beta-blocker may blunt albuterol effect'],['clopidogrel','ibuprofen','Major','Additive bleeding risk'],['clopidogrel','aspirin','Moderate','Additive bleeding risk']];
const dk=n=>Object.keys(DB).find(k=>String(n).toLowerCase().includes(k));
const actKeys=p=>[...new Set(p.meds.filter(m=>!m[3]).map(m=>dk(m[0])).filter(Boolean))];
const pairs=(a,b)=>IX.filter(x=>(x[0]===a&&x[1]===b)||(x[0]===b&&x[1]===a));
function allIx(p){const k=actKeys(p),r=[];for(let i=0;i<k.length;i++)for(let j=i+1;j<k.length;j++)pairs(k[i],k[j]).forEach(x=>r.push(x));return r}
function lookup(name,p){const k=dk(name);if(!k)return{drug:name,found:false};const d=DB[k],ix=[];actKeys(p).forEach(a=>{if(a!==k)pairs(k,a).forEach(x=>ix.push(x))});
 const al=d[2]&&p.allergies.toLowerCase().includes(d[2])?'Patient allergy on file: '+p.allergies:null;
 return{drug:name,found:true,class:d[0],adverse:d[1],allergyAlert:al,interactions:ix.map(x=>({with:x[0]===k?x[1]:x[0],severity:x[2],note:x[3]}))}}
let dq='';
let fda=null;
const cl=t=>{t=Array.isArray(t)?t.join(' '):t;if(!t)return'';t=String(t).replace(/\s+/g,' ');return t.length>900?t.slice(0,900)+'…':t};
async function fdaFetch(name){const q=encodeURIComponent('"'+name+'"');
 const r=await fetch('https://api.fda.gov/drug/label.json?search=openfda.generic_name:'+q+'+openfda.brand_name:'+q+'&limit=1');
 if(!r.ok)throw new Error(r.status);const x=(await r.json()).results[0],o=x.openfda||{};
 return{generic:(o.generic_name||[])[0],brand:(o.brand_name||[])[0],cls:(o.pharm_class_epc||[]).join('; '),boxed:cl(x.boxed_warning),interactions:cl(x.drug_interactions),adverse:cl(x.adverse_reactions),contra:cl(x.contraindications),full:Array.isArray(x.drug_interactions)?x.drug_interactions.join(' '):String(x.drug_interactions||'')}}
function runLookup(){dq=$('#dbq').value.trim();if(!dq)return;fda={q:dq,status:'loading'};render();
 fdaFetch(dq).then(d=>{fda={q:dq,status:'ok',d};render()}).catch(()=>{fda={q:dq,status:'err'};render()})}
function drugPanel(p){const r=dq?lookup(dq,p):null,ixs=allIx(p);let live='';
 if(fda&&fda.q===dq){
  if(fda.status==='loading')live='<div class="dev">Searching openFDA…</div>';
  else if(fda.status==='err')live='<div class="dev">Live openFDA lookup unavailable (published pages block outside network calls, or no label matched). Download this file and open it locally for live FDA labels. Built-in mock data is shown below.</div>';
  else{const d=fda.d,m=actKeys(p).filter(k=>d.full.toLowerCase().includes(k));
   live=`<div style="padding:12px"><b>FDA label (openFDA, live)</b>: ${esc(d.brand||'')} ${d.generic?'('+esc(d.generic)+')':''}<br>${d.cls?'Class: '+esc(d.cls)+'<br>':''}${m.length?`<div class="urg">Label interaction text mentions this patient's current meds: ${esc(m.join(', '))}</div>`:''}${d.boxed?`<br><b>Boxed warning</b>: ${esc(d.boxed)}`:''}<br><br><b>Drug interactions</b>: ${esc(d.interactions||'Not listed')}<br><br><b>Adverse reactions</b>: ${esc(d.adverse||'Not listed')}<br><br><b>Contraindications</b>: ${esc(d.contra||'Not listed')}</div>`}}
 return `<div class="card"><h3>Drug Information</h3><div class="dev">Live source: openFDA drug labels (free, no key; only the drug name is sent, never patient data). Fallback: small built-in mock list.</div>
 <div class="comp"><input class="q" id="dbq" placeholder="Look up a drug, e.g. amoxicillin, ibuprofen" value="${esc(dq)}"><button class="pri" id="dbgo">Look up</button></div>${live}
 ${r?(r.found?`<div style="padding:12px"><b>Built-in mock data · ${esc(r.drug)}</b> · ${r.class}<br>Common adverse effects: ${esc(r.adverse)}${r.allergyAlert?`<div class="urg">ALLERGY ALERT: ${esc(r.allergyAlert)}</div>`:''}<br><br><b>Interactions with current medications</b>${r.interactions.length?`<div class="tw"><table>${r.interactions.map(x=>`<tr><td>${esc(x.with)}</td><td class="sev-${x.severity}">${x.severity}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div>`:'<br>None found.'}</div>`:`<div style="padding:12px" class="mu">"${esc(r.drug)}" is not in the mock list.</div>`):''}</div>
 <div class="card"><h3>Interactions among ${esc(p.name.split(',')[0])}'s current medications (mock)</h3><div class="tw"><table><tr><th>Pair</th><th>Severity</th><th>Note</th></tr>${ixs.map(x=>`<tr><td>${esc(x[0])} + ${esc(x[1])}</td><td class="sev-${x[2]}">${x[2]}</td><td>${esc(x[3])}</td></tr>`).join('')||'<tr><td colspan="3" class="mu">None found</td></tr>'}</table></div></div>`}
function render(){
 $('#list').innerHTML=P.map(p=>`<div class="pt ${p.id===sel?'on':''}" data-id="${p.id}"><div><b>${esc(p.name)}</b><small>${p.age} y ${p.sex} · MRN ${p.mrn}</small>${p.urgent?'<span class="urgtag">URGENT</span>':''}</div>${S.unread[p.id]?`<span class="badge">${S.unread[p.id]}</span>`:''}</div>`).join('');
 const p=cur();
 let h=`<div class="ban"><h2>${esc(p.name)}</h2><span>DOB <b>${p.dob}</b> (${p.age} y)</span><span>Sex <b>${p.sex}</b></span><span>MRN <b>${p.mrn}</b></span><span>PCP <b>${esc(p.pcp)}</b></span><span>Allergies <b class="alg">${esc(p.allergies)}</b></span>${p.urgent?'<div class="urg" style="width:100%">URGENT: patient reports chest pressure with arm radiation and shortness of breath. Needs immediate clinician review.</div>':''}</div>
 <nav>${[['chart','Chart Review'],['inbox','In Basket – Messages'],['drug','Drug Information'],['fhir','FHIR R4 (dev)']].map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav>`;
 if(tab==='chart'){
  const med=p.meds;
  h+=`<div class="card"><h3>Problem List</h3><div class="tw"><table><tr><th>Diagnosis</th><th>ICD-10</th></tr>${p.problems.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h3>Medications &amp; Changes</h3><div class="tw"><table><tr><th>Medication</th><th>Sig</th><th>Start</th><th>End</th><th>Note</th><th>Source</th></tr>${med.slice().sort((a,b)=>b[2].localeCompare(a[2])).map(m=>`<tr><td><b>${esc(m[0])}</b></td><td>${esc(m[1])}</td><td>${fd(m[2])}</td><td>${m[3]?fd(m[3]):'<span class="mu">active</span>'}</td><td>${esc(m[4])}</td><td class="mu">${esc(m[5])}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">None</td></tr>'}</table></div></div>
  <div class="card"><h3>Results</h3><div class="tw"><table><tr><th>Date</th><th>Component</th><th>Value</th><th>Ref range</th><th>Flag</th><th>Source</th></tr>${p.labs.slice().sort((a,b)=>b[0].localeCompare(a[0])).map(l=>`<tr><td>${fd(l[0])}</td><td>${esc(l[1])}</td><td class="${l[4]?'flag':''}">${esc(l[2])}</td><td>${l[3]}</td><td class="flag">${l[4]}</td><td class="mu">${esc(l[5])}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">None</td></tr>'}</table></div></div>
  <div class="card"><h3>Encounters &amp; Provider Notes</h3><div class="tw"><table><tr><th>Date</th><th>Type</th><th>Provider</th><th>Note (as documented)</th></tr>${p.visits.slice().sort((a,b)=>b[0].localeCompare(a[0])).map(v=>`<tr><td>${fd(v[0])}</td><td>${esc(v[1])}</td><td>${esc(v[2])}</td><td>${esc(v[3])}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">None</td></tr>'}</table></div></div>`;
 }else if(tab==='inbox'){
  S.unread[p.id]=0;
  h+=`<div class="card"><h3>Patient Message · ${esc(p.name)}</h3><div class="dev">Test fixture · onset: ${fd(p.onset)} · incomplete in initial message: ${p.missing.length?p.missing.join(', '):'nothing (complete)'}</div>
  <div class="thread" id="th">${S.msgs[p.id].map(m=>`<div class="m ${m.from}">${esc(m.text)}<small>${m.from==='p'?esc(p.name.split(',')[0])+'<span class="tag">patient-reported</span>':'Dr. Whitfield'} · ${ft(m.t)}</small></div>`).join('')}${typing===p.id?'<div class="m mu">Patient is typing…</div>':''}</div>
  <div class="comp"><textarea id="tx" placeholder="Reply to patient… (Enter to send, Shift+Enter for new line)"></textarea><button class="pri" id="snd">Send</button></div></div>`;
 }else if(tab==='drug'){h+=drugPanel(p)}else h+=`<div class="card"><h3>FHIR R4 Bundle – same data an Epic adapter would return</h3><pre>${esc(JSON.stringify(fhir(p),null,2))}</pre></div>`;
 $('#main').innerHTML=h;
 const th=$('#th');if(th)th.scrollTop=th.scrollHeight;
 if(tab==='inbox'){const tx=$('#tx');if(tx&&!typing)tx.focus()}
 save()}
document.addEventListener('click',e=>{const hh=e.target.closest('.card>h3');if(hh){hh.parentElement.classList.toggle('col');return}const a=e.target.closest('[data-id]'),b=e.target.closest('[data-tab]');

 chart:(id,o={})=>{const p=P.find(x=>x.id===id),a=o.from||'0000',b=o.to||'9999',r=d=>d>=a&&d<=b;return{meds:p.meds.filter(m=>r(m[2])||(m[3]&&r(m[3]))),labs:p.labs.filter(l=>r(l[0])),visits:p.visits.filter(v=>r(v[0]))}},
 fhir:id=>fhir(P.find(x=>x.id===id)),messages:id=>S.msgs[id].slice(),send:(id,t)=>send(id,t),onPatientMessage:f=>subs.push(f),drugLabelLive:n=>fdaFetch(n),drugLookup:(d,id)=>lookup(d,P.find(x=>x.id===id)),interactions:id=>allIx(P.find(x=>x.id===id)).map(x=>({a:x[0],b:x[1],severity:x[2],note:x[3]}))};
